name: Visit Priority Content Pipeline

# Permanent automation: one GitHub secret (CRON_SECRET) + merge to production/astro.
#
# One-time setup (repo admin, local machine with vercel CLI):
#   ./scripts/setup-github-cron-secret.sh
#
# After setup:
#   • Merge visit-priority draft JSON to production/astro → auto-apply
#   • Cloud agents: commit drafts, merge PR, done (no manual trigger)
#
# Credential fallbacks if CRON_SECRET is not set:
#   • VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID → vercel pull
#   • SUPABASE_SERVICE_ROLE_KEY (+ SUPABASE_URL already in GitHub)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply inserts and rewrites to production
        type: boolean
        default: false
      rewrite_only_unstaged:
        description: Only rewrite slugs without existing staging_rewrite_at
        type: boolean
        default: false
  push:
    branches:
      - production/astro
    paths:
      - '.github/workflows/visit-priority-pipeline.yml'
      - 'reports/phase-1b/visit-priority/**'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve apply mode
        id: flags
        env:
          DISPATCH_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          APPLY=false
          REWRITE_ONLY_UNSTAGED=false

          if [ "$DISPATCH_APPLY" = "true" ]; then
            APPLY=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rewrite_only_unstaged }}" = "true" ]; then
            REWRITE_ONLY_UNSTAGED=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[visit-priority-apply\]'; then
              APPLY=true
            elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)
              if printf '%s\n' "$CHANGED" | grep -qE 'reports/phase-1b/visit-priority/.*-drafts\.json'; then
                APPLY=true
              fi
            fi
          fi

          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "rewrite_only_unstaged=$REWRITE_ONLY_UNSTAGED" >> "$GITHUB_OUTPUT"
          echo "Apply mode: $APPLY (rewrite_only_unstaged=$REWRITE_ONLY_UNSTAGED)"

      - name: Run visit-priority pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLY: ${{ steps.flags.outputs.apply }}
          REWRITE_ONLY_UNSTAGED: ${{ steps.flags.outputs.rewrite_only_unstaged }}
        run: |
          set -euo pipefail

          PAYLOAD=$(node -e "console.log(JSON.stringify({ apply: process.env.APPLY === 'true', rewriteOnlyUnstaged: process.env.REWRITE_ONLY_UNSTAGED === 'true' }))")
          export APPLY REWRITE_ONLY_UNSTAGED

          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Using CRON_SECRET → production admin API"
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://www.deeper.global/api/admin/run-visit-priority-pipeline" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "$BODY" | tee pipeline-response.json
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Pipeline request failed with HTTP ${HTTP_CODE}"
              exit 1
            fi
            exit 0
          fi

          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Using VERCEL_TOKEN → vercel pull → local pipeline script"
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          elif [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Using SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY → local pipeline script"
            export SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY
          else
            echo "::error::Missing credentials."
            echo "Run once: ./scripts/setup-github-cron-secret.sh"
            echo "Or add VERCEL_TOKEN trio / SUPABASE_SERVICE_ROLE_KEY to GitHub secrets."
            exit 1
          fi

          ARGS=""
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$REWRITE_ONLY_UNSTAGED" = "true" ]; then ARGS="$ARGS --rewrite-only-unstaged"; fi
          npm run content:run-visit-priority-pipeline -- $ARGS | tee pipeline-response.json

      - name: Upload pipeline response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visit-priority-pipeline-response
          path: pipeline-response.json
          if-no-files-found: ignore
