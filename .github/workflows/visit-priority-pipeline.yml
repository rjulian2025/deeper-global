name: Visit Priority Content Pipeline

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply inserts and rewrites to production
        type: boolean
        default: false
      rewrite_only_unstaged:
        description: Only rewrite slugs without existing staging_rewrite_at
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run visit-priority pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ inputs.rewrite_only_unstaged }}" = "true" ]; then ARGS="$ARGS --rewrite-only-unstaged"; fi
          npm run content:run-visit-priority-pipeline -- $ARGS

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visit-priority-pipeline-report
          path: reports/phase-1b/visit-priority/pipeline-run-*.json
          if-no-files-found: ignore
