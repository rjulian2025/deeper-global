name: Visit Priority Content Pipeline

# Production secrets live only in Vercel. CI pulls them at runtime via VERCEL_TOKEN.
#
# One-time setup (repo admin):
#   GitHub → Settings → Secrets → Actions → VERCEL_TOKEN
#   Vercel production env must include CRON_SECRET, SUPABASE_*, ANTHROPIC_API_KEY
#
# Triggers:
#   • Merge *-drafts.json to production/astro → auto-apply
#   • workflow_dispatch from GitHub UI / mobile (apply on/off)
#   • Commit message [visit-priority-apply] → force apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply inserts and rewrites to production
        type: boolean
        default: false
      rewrite_only_unstaged:
        description: Only rewrite slugs without existing staging_rewrite_at
        type: boolean
        default: false
  push:
    branches:
      - production/astro
    paths:
      - '.github/workflows/visit-priority-pipeline.yml'
      - 'reports/phase-1b/visit-priority/**'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve apply mode
        id: flags
        env:
          DISPATCH_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          APPLY=false
          REWRITE_ONLY_UNSTAGED=false

          if [ "$DISPATCH_APPLY" = "true" ]; then
            APPLY=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rewrite_only_unstaged }}" = "true" ]; then
            REWRITE_ONLY_UNSTAGED=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[visit-priority-apply\]'; then
              APPLY=true
            elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)
              if printf '%s\n' "$CHANGED" | grep -qE 'reports/phase-1b/visit-priority/.*-drafts\.json'; then
                APPLY=true
              fi
            fi
          fi

          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "rewrite_only_unstaged=$REWRITE_ONLY_UNSTAGED" >> "$GITHUB_OUTPUT"
          echo "Apply mode: $APPLY (rewrite_only_unstaged=$REWRITE_ONLY_UNSTAGED)"

      - name: Pull production secrets from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          chmod +x .github/scripts/pull-vercel-production-env.sh
          .github/scripts/pull-vercel-production-env.sh

      - name: Run visit-priority pipeline
        env:
          APPLY: ${{ steps.flags.outputs.apply }}
          REWRITE_ONLY_UNSTAGED: ${{ steps.flags.outputs.rewrite_only_unstaged }}
        run: |
          set -euo pipefail

          CRON_SECRET="$(node .github/scripts/read-vercel-env.mjs CRON_SECRET)"
          echo "::add-mask::$CRON_SECRET"

          PAYLOAD=$(node -e "console.log(JSON.stringify({ apply: process.env.APPLY === 'true', rewriteOnlyUnstaged: process.env.REWRITE_ONLY_UNSTAGED === 'true' }))")

          echo "Using Vercel production CRON_SECRET → admin API"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://www.deeper.global/api/admin/run-visit-priority-pipeline" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY" | tee pipeline-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Pipeline request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Upload pipeline response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visit-priority-pipeline-response
          path: pipeline-response.json
          if-no-files-found: ignore
