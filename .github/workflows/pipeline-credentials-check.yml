name: Pipeline Credentials Check

# Weekly canary: pulls CRON_SECRET from Vercel production and validates /api/admin/health.
# Fails early if VERCEL_TOKEN is missing, Vercel env is empty, or production rejects auth.

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull production secrets from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          chmod +x .github/scripts/pull-vercel-production-env.sh
          .github/scripts/pull-vercel-production-env.sh

      - name: Validate production admin health
        run: |
          set -euo pipefail

          CRON_SECRET="$(node .github/scripts/read-vercel-env.mjs CRON_SECRET)"
          echo "::add-mask::$CRON_SECRET"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X GET "https://www.deeper.global/api/admin/health" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Production admin health check failed (HTTP ${HTTP_CODE}). Inspect Vercel production env vars."
            exit 1
          fi

          echo "$BODY" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const cron = data.CRON_SECRET;
            if (!cron?.exists || !cron?.length) {
              console.error('::error::CRON_SECRET missing or empty in production runtime.');
              process.exit(1);
            }
            if (cron.hex64 === false) {
              console.error('::error::CRON_SECRET format check failed (expected 64-char hex).');
              process.exit(1);
            }
            if (data.ok === false) {
              console.error('::error::Production health report ok=false.');
              process.exit(1);
            }
            console.log('Production admin health OK');
          "
