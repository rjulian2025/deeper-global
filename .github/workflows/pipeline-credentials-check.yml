name: Pipeline Credentials Check

# Weekly canary: confirms CRON_SECRET in GitHub matches production admin API.
# Fails early if the secret is missing, rotated on Vercel only, or has whitespace.

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate CRON_SECRET against production admin API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secret CRON_SECRET. Run ./scripts/setup-github-cron-secret.sh once."
            exit 1
          fi
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://www.deeper.global/api/admin/run-visit-priority-pipeline" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"apply":false}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::CRON_SECRET rejected by production admin API (HTTP ${HTTP_CODE}). Re-run setup-github-cron-secret.sh."
            exit 1
          fi
          echo "CRON_SECRET OK (dry-run pipeline succeeded)"
