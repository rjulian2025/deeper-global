name: Related Questions Backfill (dry-run, commit plan)

on:
  workflow_dispatch: {}

jobs:
  dryrun:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run backfill dry-run
        run: |
          set -euo pipefail
          node scripts/backfill-related-questions.mjs | tee dryrun-log.json
      - name: Commit plan JSON
        run: |
          set -euo pipefail
          file="$(jq -r '.wrote' dryrun-log.json)"
          if [ -f "$file" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file"
            git commit -m "chore: add related backfill dry-run plan"
            git push
          else
            echo "Plan file not found"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: related-backfill-dryrun
          path: |
            dryrun-log.json
            reports/data-integrity/related-backfill-plan-*.json

