name: Retired Redirects Detect (commit report and file updates)

on:
  push:
    branches:
      - cursor/audit-warnings-backfill-1017
    paths:
      - '.github/workflows/retired-redirects-detect.yml'
      - 'scripts/detect-missing-redirects.mjs'
  workflow_dispatch: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run detector and update files
        run: |
          set -euo pipefail
          node scripts/detect-missing-redirects.mjs --apply-files | tee detect-log.json
      - name: Commit report and redirect updates
        run: |
          set -euo pipefail
          file="$(jq -r '.wrote' detect-log.json)"
          if [ -f "$file" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file" vercel.json scripts/lib/redirect-sources.mjs
            git commit -m "chore: add retired redirects report and update redirects"
            git push
          else
            echo "Detector report file not found"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-redirects-detect
          path: |
            detect-log.json
            reports/data-integrity/retired-redirects-report-*.json

