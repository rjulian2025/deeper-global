name: Data Integrity Fix: duplicate slugs

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch: {}

jobs:
  fix-duplicates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check env readiness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node -e "import('./scripts/lib/supabase-env.mjs').then(m=>console.log(JSON.stringify(m.envStatus(),null,2)))"

      - name: Fix duplicate slugs (apply)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fix-duplicate-slugs.mjs --apply

      - name: Upload fix artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-integrity-duplicate-fix
          path: |
            reports/data-integrity/backup-duplicate-slugs-*.json
            reports/data-integrity/plan-duplicate-slugs-*.json
          if-no-files-found: warn
