<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Deeper Global mental health answers for private questions</title>
  <desc id="og-desc">Typographic Open Graph card for deeper.global</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f33" />
      <stop offset="55%" stop-color="#102a43" />
      <stop offset="100%" stop-color="#163552" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <text x="72" y="92" fill="#a8cde8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="3.2">THE QUESTIONS YOU ASK WHEN NO ONE IS LOOKING</text>
